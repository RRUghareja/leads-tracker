# Runs the whole app: docker compose up --build
#   Web portal: http://localhost:3000   (sign-in popup: admin@gmail.com / admin123)
#   API:        http://localhost:4000
#
# Login is ON by default with the demo login admin@gmail.com / admin123, for both the portal and the API.
# Before using this for anything real, uncomment the lines below and choose your own password
# (use the same values in the api and web services so they keep working together).
services:
  api:
    build:
      context: .
      target: api
    ports:
      - '4000:4000'
    environment:
      CORS_ORIGIN: http://localhost:3000
      # Your own API login (set both):
      # BASIC_AUTH_USER: admin@gmail.com
      # BASIC_AUTH_PASSWORD: change-me
      # Or turn the API login off:
      # BASIC_AUTH_ENABLED: 'false'
    volumes:
      - leads-data:/data
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    ports:
      - '3000:3000'
    environment:
      API_URL: http://api:4000
      # Your own portal sign-in (set both):
      # PORTAL_LOGIN_USER: admin@gmail.com
      # PORTAL_LOGIN_PASSWORD: change-me
      # Or turn the portal sign-in popup off:
      # PORTAL_LOGIN_ENABLED: 'false'
      # The login this service sends to the API: must match the API's login above.
      # API_BASIC_AUTH_USER: admin@gmail.com
      # API_BASIC_AUTH_PASSWORD: change-me
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  leads-data:
